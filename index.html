
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Bible Verse</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>✝ Daily Bible Verse</h1>
        <p>Faith, Hope, and Love</p>
    </header>

    <main class="verse-card">
        <div class="cross">✝</div>

        <h2>Verse of the Day</h2>

        <p id="verse">
            "I can do all things through Christ
            which strengtheneth me."
        </p>

        <h3 id="reference">Philippians 4:13 (KJV)</h3>

        <button id="newVerse">Read Another Verse</button>
    </main>

    <footer>
        <p>Walk by faith, not by sight. ❤️</p>
    </footer>

    <script src="app.js"></script>
</body>
</html>
